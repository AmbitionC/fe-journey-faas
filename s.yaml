edition: 1.0.0
name: 'fe-journey-faas' #  项目名称
access: 'aliyun' #  秘钥别名

vars:
  service:
    name: fe-journey-faas
    description: 'frontend journey faas service'
services:
  project-0981cd9b07:
    component: devsapp/fc
    props:
      region: cn-hangzhou
      service: ${vars.service}
      function:
        name: hello # 函数名
        handler: helloHttpService.handleHTTPEvent
        codeUri: '.'
        initializer: helloHttpService.initializer
      customDomains:
        - domainName: auto
          protocol: HTTP
          routeConfigs:
            - path: /*
              serviceName: ${vars.service.name}
              functionName: helloHttpService-handleHTTPEvent
      triggers:
        - name: http
          type: http
          config:
            methods:
              - GET
            authType: anonymous

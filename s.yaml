      region: cn-hangzhou
      service: ${vars.service}
      function:
        name: queryCaptcha # 函数名
        handler: authHttpService.queryCaptcha
        codeUri: '.'
        initializer: authHttpService.initializer
        runtime: nodejs16
        memorySize: 4096
        cpu: 1.5
        diskSize: 512
        timeout: 60
        instanceConcurrency: 200
      customDomains:
        - domainName: auto
          protocol: HTTP
          routeConfigs:
            - path: /auth/queryCaptcha
              serviceName: ${vars.service.name}
              functionName: authHttpService-queryCaptcha

edition: 1.0.0
name: 'fe-journey-faas' #  项目名称
access: 'aliyun' #  秘钥别名

vars:
  service:
    name: fe-journey-faas
    description: 'frontend journey faas service'
services:
  # 聚合单函数：所有 HTTP 路由由 main 一个函数内部分发（/* → main）。
  # 替代原先「一个接口一个函数」的 50+ 函数结构，规避 FC 单服务 50 函数上限。
  main:
    component: devsapp/fc
    props:
      region: cn-hangzhou
      service: ${vars.service}
      function:
        name: main
        handler: main.handler
        codeUri: '.'
        initializer: main.initializer
        runtime: nodejs16
        memorySize: 4096
        cpu: 1.5
        diskSize: 512
        timeout: 120
        instanceConcurrency: 100
      customDomains:
        - domainName: auto
          protocol: HTTP
          routeConfigs:
            - path: /*
              serviceName: ${vars.service.name}
              functionName: main
      triggers:
        - name: http
          type: http
          config:
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD
            authType: anonymous

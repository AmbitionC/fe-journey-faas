edition: 3.0.0
name: fe-journey-faas
access: aliyun

# FC 3.0 Web 函数：整个 Midway 应用作为一个 HTTP server（server.js）跑在 FC3，
# FC3 把 /* 全部请求转发到端口 9000，并原生支持响应流式（真 SSE）。
resources:
  fcJourneyMain:
    component: fc3
    props:
      region: cn-hangzhou
      functionName: fe-journey-main
      description: 'fe-journey single web function (FC3, streaming)'
      runtime: nodejs20
      # Web 函数实际由 customRuntimeConfig 的 node server.js 启动，handler 仅占位（FC3 必填）
      handler: index.handler
      code: ./
      cpu: 1.5
      memorySize: 4096
      diskSize: 512
      timeout: 120
      instanceConcurrency: 100
      # 以 Web 函数方式启动：FC3 运行 node server.js，监听 9000，转发 HTTP 并支持流式
      customRuntimeConfig:
        command:
          - node
          - server.js
        port: 9000
      environmentVariables:
        NODE_ENV: production
        LLM_PROVIDER: ${env('LLM_PROVIDER')}
        LLM_API_KEY: ${env('LLM_API_KEY')}
        LLM_MODEL: ${env('LLM_MODEL')}
      triggers:
        - triggerName: httpTrigger
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD

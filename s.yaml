edition: 3.0.0
name: fe-journey-faas
access: aliyun

# FC 3.0 Web 函数：整个 Midway 应用作为一个 HTTP server（server.js）跑在 FC3，
# FC3 把 /* 全部请求转发到端口 9000，并原生支持响应流式（真 SSE）。
resources:
  fcJourneyMain:
    component: fc3
    props:
      region: cn-hangzhou
      functionName: fe-journey-main
      description: 'fe-journey single web function (FC3, streaming)'
      runtime: custom.debian10
      # Web 函数：custom runtime 跑 node server.js，handler 占位（FC3 必填）
      handler: index.handler
      code: ./
      cpu: 1.5
      memorySize: 4096
      diskSize: 512
      timeout: 120
      instanceConcurrency: 100
      # 以 Web 函数方式启动：FC3 运行 node server.js，监听 9000，转发 HTTP 并支持流式
      customRuntimeConfig:
        # custom.debian10 不带 node，用代码包里打入的 node 二进制（workflow 下载到 noderuntime/）
        command:
          - noderuntime/bin/node
          - server.js
        port: 9000
      environmentVariables:
        NODE_ENV: production
        LLM_PROVIDER: ${env('LLM_PROVIDER')}
        LLM_API_KEY: ${env('LLM_API_KEY')}
        LLM_MODEL: ${env('LLM_MODEL')}
        # 内容管理(content)模块:GitHub 真相源 + OSS 分发 + CI 同步
        GITHUB_TOKEN: ${env('GITHUB_TOKEN')}
        GITHUB_API_BASE: https://api.github.com/repos/AmbitionC/front-end-journey-resource
        GITHUB_RAW_BASE: https://raw.githubusercontent.com/AmbitionC/front-end-journey-resource/master
        OSS_ACCESS_KEY_ID: ${env('OSS_ACCESS_KEY_ID')}
        OSS_ACCESS_KEY_SECRET: ${env('OSS_ACCESS_KEY_SECRET')}
        OSS_BUCKET: font-end-journey-resources
        OSS_REGION: oss-cn-hangzhou
        SYNC_SECRET: ${env('SYNC_SECRET')}
        # 数据库/Redis 凭证（PRD-07：移出代码，改由环境变量注入）
        DB_HOST: ${env('DB_HOST')}
        DB_USER: ${env('DB_USER')}
        DB_PASS: ${env('DB_PASS')}
        REDIS_HOST: ${env('REDIS_HOST')}
        REDIS_PASS: ${env('REDIS_PASS')}
      triggers:
        - triggerName: httpTrigger
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD

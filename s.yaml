edition: 3.0.0
name: fe-journey-faas
access: aliyun

# FC 3.0 Web 函数：整个 Midway 应用作为一个 HTTP server（server.js）跑在 FC3，
# FC3 把 /* 全部请求转发到端口 9000，并原生支持响应流式（真 SSE）。
resources:
  fcJourneyMain:
    component: fc3
    props:
      region: cn-hangzhou
      functionName: fe-journey-main
      description: 'fe-journey single web function (FC3, streaming)'
      runtime: custom.debian10
      # Web 函数：custom runtime 跑 node server.js，handler 占位（FC3 必填）
      handler: index.handler
      code: ./
      cpu: 1.5
      memorySize: 4096
      diskSize: 512
      timeout: 120
      instanceConcurrency: 100
      # 开启函数日志，部署后冒烟失败时 Actions 可直接回捞启动错误。
      logConfig: auto
      # 以 Web 函数方式启动：FC3 运行 node server.js，监听 9000，转发 HTTP 并支持流式
      customRuntimeConfig:
        # custom.debian10 不带 node，用代码包里打入的 node 二进制（workflow 下载到 noderuntime/）
        command:
          - noderuntime/bin/node
          - server.js
        port: 9000
      environmentVariables:
        NODE_ENV: production
        LLM_PROVIDER: ${env('LLM_PROVIDER')}
        LLM_API_KEY: ${env('LLM_API_KEY')}
        LLM_MODEL: ${env('LLM_MODEL')}
        # 内容管理(content)模块:GitHub 真相源 + OSS 分发 + CI 同步
        GITHUB_TOKEN: ${env('GITHUB_TOKEN')}
        GITHUB_API_BASE: https://api.github.com/repos/AmbitionC/front-end-journey-resource
        GITHUB_RAW_BASE: https://raw.githubusercontent.com/AmbitionC/front-end-journey-resource/master
        OSS_ACCESS_KEY_ID: ${env('OSS_ACCESS_KEY_ID')}
        OSS_ACCESS_KEY_SECRET: ${env('OSS_ACCESS_KEY_SECRET')}
        OSS_BUCKET: font-end-journey-resources
        OSS_REGION: oss-cn-hangzhou
        SYNC_SECRET: ${env('SYNC_SECRET')}
        # 数据库/Redis 凭证（PRD-07：移出代码，改由环境变量注入）
        DB_HOST: ${env('DB_HOST')}
        DB_USER: ${env('DB_USER')}
        DB_PASS: ${env('DB_PASS')}
        REDIS_HOST: ${env('REDIS_HOST')}
        REDIS_PASS: ${env('REDIS_PASS')}
        # 投资驾驶舱：invest 库（同 RDS 实例，invest-model Python 端写入）
        INVEST_DB_NAME: invest
      triggers:
        - triggerName: httpTrigger
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD

  # ══ invest-model 定时任务（盯盘/复盘等，从 GitHub Actions 迁来）═══════════
  # 与 fe-journey 完全解耦：独立代码包 / 独立环境变量 / 独立触发器 / 独立部署 job，
  # 仅共用阿里云账号、地域与本仓库的部署流水线（push master 自动发布）。
  # 代码来自 AmbitionC/invest-model 仓库（invest_model/ scripts/ faas/），
  # CI 部署时 checkout 并执行其 faas/package.sh 打包到 ./invest-dist，
  # 见 .github/workflows/deploy.yml 的 deploy-invest-scheduler job。
  # FC timer 的 cronExpression 为 UTC；payload 即 faas/jobs.py 里的 job 名。

  # 盯盘专用函数：调用频繁（交易时段每 3 分钟）、轻量、短超时，独立成函数
  # 避免与长耗时的数据更新任务互相占实例/共享超时配置。
  investLiveWatch:
    component: fc3
    props:
      region: cn-hangzhou
      functionName: invest-live-watch
      description: 'A股盘中盯盘：无状态定时扫描，预警追评 GitHub issue → 邮件'
      runtime: python3.10
      handler: faas/scheduler_handler.handler
      cpu: 0.5
      memorySize: 512
      diskSize: 512
      timeout: 120
      code: ./invest-dist
      # SLS 日志（auto 自动建 project/logstore）：函数运行中日志实时可查，排障必备
      logConfig: auto
      environmentVariables:
        PYTHONUNBUFFERED: '1'
        # DB：优先整串 INVEST_DB_URL；否则由 MYSQL_* 拼接（DB_* 与 fe-journey 共用同一套 RDS 凭证）
        INVEST_DB_URL: ${env('INVEST_DB_URL', '')}
        MYSQL_HOST: ${env('DB_HOST', '')}
        MYSQL_USER: ${env('DB_USER', '')}
        MYSQL_PASSWORD: ${env('DB_PASS', '')}
        MYSQL_DATABASE: ${env('INVEST_DB_NAME', 'invest')}
        TUSHARE_TOKEN: ${env('TUSHARE_TOKEN', '')}
        TUSHARE_HTTP_URL: ${env('TUSHARE_HTTP_URL', '')}
        # 预警/复盘/计划都以 Issue 评论推送 → 邮件；PAT 仅需 invest-model Issues RW
        GITHUB_TOKEN: ${env('INVEST_GH_PAT', '')}
        GITHUB_REPOSITORY: AmbitionC/invest-model
        LIVE_WATCH_MENTION: ${env('LIVE_WATCH_MENTION', '')}
        # FC 代码目录只读：日志/结果文件落 /tmp
        INVEST_LOG_DIR: /tmp/logs
        INVEST_RESULTS_DIR: /tmp/invest-results
        DIGEST_WINDOW: '20'
        ONCE_STEP: '3'
        # 套利模块开关（默认观察态 0；启用态由部署 env 注入 1）
        ARB_ENABLED: ${env('ARB_ENABLED', '0')}
      triggers:
        - triggerName: market-hours
          triggerType: timer
          qualifier: LATEST
          triggerConfig:
            # 每 3 分钟，01:00-07:59 UTC = 北京 09:00-15:59 工作日；
            # 盘前/午休/节假日由脚本守卫毫秒级退出，空转成本可忽略。
            cronExpression: '0 0/3 1-7 ? * MON-FRI'
            enable: true
            payload: 'live_watch'

  # 其余定时任务：快照提醒 / ETF 入库 / 盘后增量更新+操作计划 / 周六全量重建+复盘。
  # 单函数多 timer，按 payload 分发；大内存长超时容纳周六全量重建（原 Actions 给 3h）。
  investScheduler:
    component: fc3
    props:
      region: cn-hangzhou
      functionName: invest-scheduler
      description: 'invest-model 定时任务：快照提醒/ETF入库/盘后更新+计划/周度重建+复盘'
      runtime: python3.10
      handler: faas/scheduler_handler.handler
      cpu: 2
      memorySize: 4096
      diskSize: 512
      timeout: 10800
      code: ./invest-dist
      # SLS 日志（auto 自动建 project/logstore）：函数运行中日志实时可查，排障必备
      logConfig: auto
      environmentVariables:
        PYTHONUNBUFFERED: '1'
        INVEST_DB_URL: ${env('INVEST_DB_URL', '')}
        MYSQL_HOST: ${env('DB_HOST', '')}
        MYSQL_USER: ${env('DB_USER', '')}
        MYSQL_PASSWORD: ${env('DB_PASS', '')}
        MYSQL_DATABASE: ${env('INVEST_DB_NAME', 'invest')}
        TUSHARE_TOKEN: ${env('TUSHARE_TOKEN', '')}
        TUSHARE_HTTP_URL: ${env('TUSHARE_HTTP_URL', '')}
        GITHUB_TOKEN: ${env('INVEST_GH_PAT', '')}
        GITHUB_REPOSITORY: AmbitionC/invest-model
        INVEST_LOG_DIR: /tmp/logs
        INVEST_RESULTS_DIR: /tmp/invest-results
        # 操作计划参数（含义与原 plan-notify workflow 的 Variables 相同）
        ACCOUNT_CASH: ${env('ACCOUNT_CASH', '0')}
        PLAN_ARGS: ${env('PLAN_ARGS', '')}
        # 套利模块开关（默认观察态 0；启用态由部署 env 注入 1）
        ARB_ENABLED: ${env('ARB_ENABLED', '0')}
      triggers:
        - triggerName: snapshot-remind
          triggerType: timer
          qualifier: LATEST
          triggerConfig:
            cronExpression: '0 20 7 ? * MON-FRI'   # 北京 15:20 持仓快照提醒
            enable: true
            payload: 'snapshot_remind'
        - triggerName: ingest-etf
          triggerType: timer
          qualifier: LATEST
          triggerConfig:
            cronExpression: '0 50 8 ? * MON-FRI'   # 北京 16:50 ETF 前复权日线入库
            enable: true
            payload: 'ingest_etf'
        - triggerName: daily-update-plan
          triggerType: timer
          qualifier: LATEST
          triggerConfig:
            cronExpression: '0 0 9 ? * MON-FRI'    # 北京 17:00 增量更新→链式出操作计划
            enable: true
            payload: 'daily_update_plan'
        - triggerName: fear-intraday
          triggerType: timer
          qualifier: LATEST
          triggerConfig:
            # 北京 10/11/13/14/15 点（UTC 2/3/5/6/7）盘中恐慌(近似)全市场快照；
            # 任务内含交易时段/交易日守卫，非时段毫秒退出；日频收盘值不受影响。
            cronExpression: '0 0 2,3,5,6,7 ? * MON-FRI'
            enable: true
            payload: 'fear_intraday'
        - triggerName: weekly-rebuild-review
          triggerType: timer
          qualifier: LATEST
          triggerConfig:
            cronExpression: '0 0 10 ? * SAT'       # 北京周六 18:00 全量重建→影子回测→复盘
            enable: true
            payload: 'weekly_rebuild_review'

name: FC logs (manual)

# 只读回捞 FC 函数日志（SLS default-logs），排障用：不改任何线上资源。
# 安全约束（2026-08-30 审查 P1-2/P1-3/P2-8 修复，勿回退）：
#   1) 手工输入一律先进 env、再在 shell 内白名单/数值校验——严禁 ${{ inputs.* }} 直接
#      拼进脚本（$()/反引号会在装载密钥的 job 里执行任意命令）；
#   2) 本仓 PUBLIC：**默认只输出结构化聚合**（scripts/summarize-logs.sh：行数/时间跨度/
#      级别分布/错误关键词计数/状态码计数/异常类名——零自由文本）。脱敏是黑名单、
#      证明不了「无 PII」，所以原文默认根本不打印；确需原文时显式开 include_text，
#      那条路径再过 scripts/redact-logs.sh 减损（2026-08-30 第三轮验收 P1-1）；
#   3) s.yaml 解析只需要变量名存在——除阿里云凭据外全部用占位值，不装载真实密钥；
#   4) set -o pipefail：控制面失败必须红，不许「查不到」伪装成「没有日志」。

on:
  workflow_dispatch:
    inputs:
      function:
        description: "s.yaml 里的资源名"
        type: choice
        default: fcJourneyMain
        options:
          - fcJourneyMain
          - investLiveWatch
          - investScheduler
      minutes:
        description: "回捞最近 N 分钟（1-240，默认 60）"
        default: "60"
      grep:
        description: "可选过滤关键词（固定字符串匹配，留空跳过）——默认只报命中行数，不打印原文"
        default: ""
      include_text:
        description: "打印脱敏后的原始日志行（默认否；脱敏是黑名单、不构成无 PII 保证）"
        type: boolean
        default: false

permissions:
  contents: read

# 占位值：s.yaml 的 ${env('...')} 只要求变量存在，日志控制面用不到真实值。
# 不要把真实 secrets 加回来——这个 job 的输出是公开的。
env:
  LLM_PROVIDER: unused
  LLM_API_KEY: unused
  LLM_MODEL: unused
  GITHUB_TOKEN: unused
  OSS_ACCESS_KEY_ID: unused
  OSS_ACCESS_KEY_SECRET: unused
  SYNC_SECRET: unused
  GROWTH_INTERNAL_USER_IDS: unused
  DB_HOST: unused
  DB_USER: unused
  DB_PASS: unused
  REDIS_HOST: unused
  REDIS_PASS: unused
  INVEST_DB_URL: unused
  INVEST_DB_NAME: unused
  TUSHARE_TOKEN: unused
  TUSHARE_HTTP_URL: unused
  INVEST_GH_PAT: unused
  LIVE_WATCH_MENTION: unused
  ACCOUNT_CASH: "0"
  PLAN_ARGS: unused
  ARB_ENABLED: "0"
  HEALTH_API_TOKEN: unused
  HEALTH_DB_NAME: unused
  HEALTH_VISION_BASE_URL: unused
  HEALTH_VISION_API_KEY: unused
  HEALTH_VISION_MODEL: unused
  HEALTH_CHAT_BASE_URL: unused
  HEALTH_CHAT_API_KEY: unused
  HEALTH_CHAT_MODEL: unused
  CORS_ALLOW_ORIGINS: unused

jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Serverless Devs
        run: npm install -g @serverless-devs/s

      - name: Configure Alibaba Cloud credentials
        run: |
          s config add \
            --AccountID "${{ secrets.ALIBABA_CLOUD_ACCOUNT_ID }}" \
            --AccessKeyID "${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}" \
            --AccessKeySecret "${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}" \
            --access aliyun \
            -f

      - name: Fetch logs (redacted)
        env:
          FN_IN: ${{ inputs.function }}
          MIN_IN: ${{ inputs.minutes }}
          GREP_IN: ${{ inputs.grep }}
          TEXT_IN: ${{ inputs.include_text }}
        run: |
          set -o pipefail
          # 白名单/数值校验（输入已在 env，不参与 shell 解析）
          case "$FN_IN" in
            fcJourneyMain|investLiveWatch|investScheduler) FN="$FN_IN";;
            *) echo "::error::非法函数名"; exit 1;;
          esac
          if ! [[ "$MIN_IN" =~ ^[0-9]{1,3}$ ]] || [ "$MIN_IN" -lt 1 ] || [ "$MIN_IN" -gt 240 ]; then
            echo "::error::minutes 必须是 1-240 的整数"; exit 1
          fi
          START=$(date -u -d "-${MIN_IN} minutes" '+%Y-%m-%dT%H:%M:%SZ')
          END=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          mkdir -p invest-dist noderuntime   # 占位：logs 只走控制面，不需要真实代码目录
          echo "→ $FN logs $START ~ $END (UTC)"
          # 原始日志只落私有临时文件；控制面失败即红（不再 || true）
          s "$FN" logs --start-time "$START" --end-time "$END" --access aliyun > /tmp/fc-logs.out 2>&1
          # 脱敏规则唯一真源＝scripts/redact-logs.sh（邮箱/授权头/Cookie/token/连接串/手机号，
          # 行为测试 test/workflow/redact.test.ts 喂合成日志把关——不在此内联复制规则）
          redact() { bash scripts/redact-logs.sh; }
          # 默认输出＝结构化聚合，零自由文本
          bash scripts/summarize-logs.sh < /tmp/fc-logs.out
          if [ -n "$GREP_IN" ]; then
            echo "===== 过滤命中行数（固定字符串）====="
            grep -icF -- "$GREP_IN" /tmp/fc-logs.out || echo 0
          fi
          if [ "$TEXT_IN" = "true" ]; then
            echo "===== ⚠️ 脱敏原文（显式索取；黑名单减损，不保证无 PII）====="
            if [ -n "$GREP_IN" ]; then
              (grep -iF -- "$GREP_IN" /tmp/fc-logs.out || echo "(无匹配)") | redact | tail -200
            else
              (grep -inE "error|timeout|ETIMEDOUT|ECONNREFUSED|EAI_AGAIN|ER_|PROTOCOL_|unhandled|FATAL|exit" /tmp/fc-logs.out || echo "(无错误类日志)") | redact | tail -200
            fi
          fi

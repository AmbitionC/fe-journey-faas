name: Deploy FaaS to Alibaba Cloud FC

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'ops/**'          # 手动调用触发文件（invoke-invest.yml），不值得触发发版
  workflow_dispatch:

# s.yaml 里的 ${env('...')} 在 s deploy 解析整份配置时取值，
# 因此两个 job 都需要暴露全部环境变量名（缺的 secret 解析为空串，不阻断部署）。
env:
  # fe-journey Web 函数
  LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
  LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
  LLM_MODEL: ${{ secrets.LLM_MODEL }}
  # 内容管理(content)模块运行时凭证(GitHub secret 名不能以 GITHUB_ 开头,故用 GH_TOKEN)
  GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
  OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
  OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
  SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
  # 数据库/Redis 凭证（PRD-07：移出代码，改由环境变量注入；DB_* 与 invest 函数共用）
  DB_HOST: ${{ secrets.DB_HOST }}
  DB_USER: ${{ secrets.DB_USER }}
  DB_PASS: ${{ secrets.DB_PASS }}
  REDIS_HOST: ${{ secrets.REDIS_HOST }}
  REDIS_PASS: ${{ secrets.REDIS_PASS }}
  # invest-model 定时函数（invest-live-watch / invest-scheduler）
  INVEST_DB_URL: ${{ secrets.INVEST_DB_URL }}
  INVEST_DB_NAME: ${{ vars.INVEST_DB_NAME || 'invest' }}
  TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
  TUSHARE_HTTP_URL: ${{ secrets.TUSHARE_HTTP_URL }}
  # fine-grained PAT：仅 invest-model 仓库 Issues RW（预警/复盘/计划推 Issue→邮件）；
  # 同时用于 CI checkout 私有仓库 invest-model。未配置时回退 GH_TOKEN。
  INVEST_GH_PAT: ${{ secrets.INVEST_GH_PAT || secrets.GH_TOKEN }}
  LIVE_WATCH_MENTION: ${{ vars.LIVE_WATCH_MENTION }}
  ACCOUNT_CASH: ${{ vars.ACCOUNT_CASH || '0' }}
  # 套利模块开关（仓库变量未设时默认 1=启用态整体测；回退设仓库变量 ARB_ENABLED=0 重部署）
  ARB_ENABLED: ${{ vars.ARB_ENABLED || '1' }}
  PLAN_ARGS: ${{ vars.PLAN_ARGS }}

jobs:
  # ── fe-journey Web 函数（原有部署，逻辑不变，仅收窄为只部署 fcJourneyMain）──
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 编译 TS 产物（server.js 运行时从 dist 加载整个应用）
      - name: Build
        run: npm run build

      # custom.debian10 自定义运行时不带 node，把 node 二进制打进代码包（noderuntime/）
      # 版本与 npm ci 的 Node 大版本一致（22.x），保证原生模块 ABI 兼容。
      # 需 ≥ 22.12：CopilotKit runtime 内部 require() ESM-only 包，22.12 起 require(esm) 默认开启。
      - name: Bundle Node.js runtime
        run: |
          curl -fsSL https://nodejs.org/dist/v22.12.0/node-v22.12.0-linux-x64.tar.xz -o /tmp/node.tar.xz
          mkdir -p noderuntime
          tar -xJf /tmp/node.tar.xz -C noderuntime --strip-components=1
          ./noderuntime/bin/node -v

      - name: Install Serverless Devs
        run: npm install -g @serverless-devs/s

      - name: Configure Alibaba Cloud credentials
        run: |
          s config add \
            --AccountID "${{ secrets.ALIBABA_CLOUD_ACCOUNT_ID }}" \
            --AccessKeyID "${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}" \
            --AccessKeySecret "${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}" \
            --access aliyun \
            -f

      # FC 3.0 Web 函数：单函数 server.js，环境变量经 ${env('...')} 注入到函数
      - name: Deploy (FC3 web function)
        run: s fcJourneyMain deploy -y --access aliyun

      # 打印函数公网地址（fcapp.run，前端 getApiDomain 使用）；只输出 URL 字段
      - name: Print function internet URL
        env:
          AK_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          AK_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          ACCOUNT_ID: ${{ secrets.ALIBABA_CLOUD_ACCOUNT_ID }}
        run: |
          pip install -q alibabacloud_fc20230330 || pip3 install -q alibabacloud_fc20230330
          python3 - << 'EOF'
          import os, json
          from alibabacloud_fc20230330.client import Client
          from alibabacloud_tea_openapi import models as open_models
          cfg = open_models.Config(
              access_key_id=os.environ['AK_ID'],
              access_key_secret=os.environ['AK_SECRET'],
              endpoint=f"{os.environ['ACCOUNT_ID']}.cn-hangzhou.fc.aliyuncs.com",
          )
          resp = Client(cfg).get_trigger('fe-journey-main', 'httpTrigger')
          ht = getattr(resp.body, 'http_trigger', None)
          print('==== FUNCTION URLS ====')
          print(json.dumps({
              'urlInternet': getattr(ht, 'url_internet', None) if ht else None,
          }, ensure_ascii=False))
          EOF

  # ── invest-model 定时函数（盯盘/复盘等，独立 job：与 fe-journey 部署互不阻塞）──
  deploy-invest-scheduler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout invest-model
        uses: actions/checkout@v4
        with:
          repository: AmbitionC/invest-model
          ref: master
          token: ${{ secrets.INVEST_GH_PAT || secrets.GH_TOKEN }}
          path: invest-model-src

      # 与 FC python3.10 运行时同版本，保证二进制依赖（pandas/numpy）ABI 兼容
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Package invest FaaS code
        run: bash invest-model-src/faas/package.sh "$GITHUB_WORKSPACE/invest-dist"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Serverless Devs
        run: npm install -g @serverless-devs/s

      - name: Configure Alibaba Cloud credentials
        run: |
          s config add \
            --AccountID "${{ secrets.ALIBABA_CLOUD_ACCOUNT_ID }}" \
            --AccessKeyID "${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}" \
            --AccessKeySecret "${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}" \
            --access aliyun \
            -f

      - name: Deploy invest FC functions (timer triggers)
        run: |
          s investLiveWatch deploy -y --access aliyun
          s investScheduler deploy -y --access aliyun

      # 冒烟测试：真实同步调用一次盯盘 job。非交易时段/节假日会走守卫毫秒退出
      # （返回 skipped），任何时段都无副作用风险极小；函数报错则本步骤失败。
      - name: Smoke test (invoke live_watch once)
        run: |
          # s invoke 对函数报错也返回 0，这里显式检查 InvocationError 让本步骤如实变红
          s investLiveWatch invoke -e '{"payload":"live_watch"}' --access aliyun | tee /tmp/smoke.out
          ! grep -q "Error Type: InvocationError" /tmp/smoke.out

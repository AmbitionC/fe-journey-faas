name: Deploy FaaS to Alibaba Cloud FC

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 编译 TS 产物（server.js 运行时从 dist 加载整个应用）
      - name: Build
        run: npm run build

      # custom.debian10 自定义运行时不带 node，把 node 二进制打进代码包（noderuntime/）
      # 版本与 npm ci 的 Node 大版本一致（20.x），保证原生模块 ABI 兼容
      - name: Bundle Node.js runtime
        run: |
          curl -fsSL https://nodejs.org/dist/v20.18.1/node-v20.18.1-linux-x64.tar.xz -o /tmp/node.tar.xz
          mkdir -p noderuntime
          tar -xJf /tmp/node.tar.xz -C noderuntime --strip-components=1
          ./noderuntime/bin/node -v

      - name: Install Serverless Devs
        run: npm install -g @serverless-devs/s

      - name: Configure Alibaba Cloud credentials
        run: |
          s config add \
            --AccountID "${{ secrets.ALIBABA_CLOUD_ACCOUNT_ID }}" \
            --AccessKeyID "${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}" \
            --AccessKeySecret "${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}" \
            --access aliyun \
            -f

      # FC 3.0 Web 函数：单函数 server.js，环境变量经 ${env('...')} 注入到函数
      - name: Deploy (FC3 web function)
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          # 内容管理(content)模块运行时凭证(GitHub secret 名不能以 GITHUB_ 开头,故用 GH_TOKEN)
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
          # 数据库/Redis 凭证（PRD-07：移出代码，改由环境变量注入）
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PASS: ${{ secrets.REDIS_PASS }}
        run: s deploy -y --access aliyun

# 查询 fe-journey-main 函数的公网访问地址（fcapp.run）。
# 用途：前端需要函数系统分配的 URL（带随机后缀，仓库内拿不到）。
# 通过 FC OpenAPI GetTrigger 直接读取，只输出 URL 字段，不打印任何敏感信息。
name: FC function info (URL only)

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'ops/fc-info.trigger'   # 改动此文件即触发（与 invoke-invest.yml 同模式）

jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - name: Query trigger urlInternet via FC OpenAPI
        env:
          AK_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          AK_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          ACCOUNT_ID: ${{ secrets.ALIBABA_CLOUD_ACCOUNT_ID }}
        run: |
          pip install -q alibabacloud_fc20230330
          python3 - << 'EOF'
          import os, json
          from alibabacloud_fc20230330.client import Client
          from alibabacloud_tea_openapi import models as open_models

          cfg = open_models.Config(
              access_key_id=os.environ['AK_ID'],
              access_key_secret=os.environ['AK_SECRET'],
              endpoint=f"{os.environ['ACCOUNT_ID']}.cn-hangzhou.fc.aliyuncs.com",
          )
          client = Client(cfg)
          resp = client.get_trigger('fe-journey-main', 'httpTrigger')
          body = resp.body
          urls = {}
          ht = getattr(body, 'http_trigger', None)
          if ht is not None:
              urls['urlInternet'] = getattr(ht, 'url_internet', None)
              urls['urlIntranet'] = getattr(ht, 'url_intranet', None)
          print('==== FUNCTION URLS ====')
          print(json.dumps(urls, ensure_ascii=False))
          EOF

# 查询 fe-journey-main 函数的公网访问地址（fcapp.run）。
# 用途：前端需要函数系统分配的 URL（带随机后缀，仓库内拿不到）。
# 安全：s info 输出包含环境变量明文，这里只允许打印含 fcapp.run / url 的行。
name: FC function info (URL only)

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'ops/fc-info.trigger'   # 改动此文件即触发（与 invoke-invest.yml 同模式）

# s.yaml 解析需要这些 ${env('...')} 存在（值可为空，info 只读函数信息）
env:
  LLM_PROVIDER: ''
  LLM_API_KEY: ''
  LLM_MODEL: ''
  GITHUB_TOKEN: ''
  OSS_ACCESS_KEY_ID: ''
  OSS_ACCESS_KEY_SECRET: ''
  SYNC_SECRET: ''
  DB_HOST: ''
  DB_USER: ''
  DB_PASS: ''
  REDIS_HOST: ''
  REDIS_PASS: ''
  INVEST_DB_URL: ''
  INVEST_DB_NAME: invest
  TUSHARE_TOKEN: ''
  TUSHARE_HTTP_URL: ''
  INVEST_GH_PAT: ''
  LIVE_WATCH_MENTION: ''
  ACCOUNT_CASH: '0'
  PLAN_ARGS: ''

jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Serverless Devs
        run: npm install -g @serverless-devs/s

      - name: Configure Alibaba Cloud credentials
        run: |
          s config add \
            --AccountID "${{ secrets.ALIBABA_CLOUD_ACCOUNT_ID }}" \
            --AccessKeyID "${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}" \
            --AccessKeySecret "${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}" \
            --access aliyun \
            -f

      - name: Query function internet URL
        run: |
          # 只输出 URL/键名，绝不打印完整 info（其中含环境变量明文）
          rc1=0; rc2=0
          s fcJourneyMain info --access aliyun -o json > /tmp/info1.json 2>/tmp/info1.err || rc1=$?
          s info --access aliyun -o json > /tmp/info2.json 2>/tmp/info2.err || rc2=$?
          echo "exit codes: fcJourneyMain=$rc1 all=$rc2"
          wc -c /tmp/info1.json /tmp/info1.err /tmp/info2.json /tmp/info2.err || true
          echo '==== URL GREP ===='
          grep -hoE 'https://[a-zA-Z0-9.-]*fcapp\.run[^" ]*' /tmp/info1.json /tmp/info2.json /tmp/info1.err /tmp/info2.err 2>/dev/null | sort -u || true
          echo '==== JSON KEY STRUCTURE (键名，无值) ===='
          python3 - << 'EOF'
          import json
          for f in ('/tmp/info1.json', '/tmp/info2.json'):
              try:
                  raw = open(f).read()
                  raw = raw[raw.index('{'):]
                  d = json.loads(raw)
              except Exception as e:
                  print(f, 'parse fail:', e)
                  continue
              print('--', f)
              def keys(o, p=''):
                  if isinstance(o, dict):
                      for k, v in o.items():
                          print('KEY', p + k)
                          keys(v, p + k + '.')
                  elif isinstance(o, list):
                      for i, x in enumerate(o[:3]):
                          keys(x, f'{p}{i}.')
              keys(d)
          EOF
          echo '==== STDERR (已过滤敏感行) ===='
          grep -hviE 'key|secret|pass|token' /tmp/info1.err /tmp/info2.err 2>/dev/null | head -20 || true

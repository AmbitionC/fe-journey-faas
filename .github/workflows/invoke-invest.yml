name: Invoke invest job (manual)

# 手动触发 invest FC 函数的任意定时 job（冒烟/补跑用）。
# 等价于 FC 控制台的「测试函数」，但不用登阿里云；结果与函数日志直接打在本步骤输出里。
# 注意：snapshot_remind / daily_update_plan / weekly_rebuild_review 会真实推送
# Issue 评论（有当日防重）；ingest_etf / daily_update_plan 会真实写库（幂等）。

on:
  workflow_dispatch:
    inputs:
      job:
        description: "要执行的 job（faas/jobs.py）"
        type: choice
        default: snapshot_remind
        options:
          - live_watch
          - snapshot_remind
          - ingest_etf
          - daily_update_plan
          - weekly_rebuild_review
  # 无 Actions 写权限的集成（如 Claude 会话）用 push 触发：
  # 把 job 名写进 ops/invoke.trigger 第一行后 push master 即可
  push:
    branches: [master]
    paths:
      - 'ops/invoke.trigger'

# s.yaml 解析需要全部 ${env('...')} 变量名存在（与 deploy.yml 相同的一套）
env:
  LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
  LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
  LLM_MODEL: ${{ secrets.LLM_MODEL }}
  GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
  OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
  OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
  SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
  DB_HOST: ${{ secrets.DB_HOST }}
  DB_USER: ${{ secrets.DB_USER }}
  DB_PASS: ${{ secrets.DB_PASS }}
  REDIS_HOST: ${{ secrets.REDIS_HOST }}
  REDIS_PASS: ${{ secrets.REDIS_PASS }}
  INVEST_DB_URL: ${{ secrets.INVEST_DB_URL }}
  INVEST_DB_NAME: ${{ vars.INVEST_DB_NAME || 'invest' }}
  TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
  TUSHARE_HTTP_URL: ${{ secrets.TUSHARE_HTTP_URL }}
  INVEST_GH_PAT: ${{ secrets.INVEST_GH_PAT || secrets.GH_TOKEN }}
  LIVE_WATCH_MENTION: ${{ vars.LIVE_WATCH_MENTION }}
  ACCOUNT_CASH: ${{ vars.ACCOUNT_CASH || '0' }}
  PLAN_ARGS: ${{ vars.PLAN_ARGS }}

jobs:
  invoke:
    runs-on: ubuntu-latest
    timeout-minutes: 190   # daily/weekly 档含数据管线，放宽到与原 data-update 一致
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Serverless Devs
        run: npm install -g @serverless-devs/s

      - name: Configure Alibaba Cloud credentials
        run: |
          s config add \
            --AccountID "${{ secrets.ALIBABA_CLOUD_ACCOUNT_ID }}" \
            --AccessKeyID "${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}" \
            --AccessKeySecret "${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}" \
            --access aliyun \
            -f

      - name: Invoke
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            JOB="${{ inputs.job }}"
          else
            JOB="$(head -1 ops/invoke.trigger | tr -d ' \r\n')"
          fi
          case "$JOB" in
            live_watch|snapshot_remind|ingest_etf|daily_update_plan|weekly_rebuild_review) ;;
            *) echo "未知 job: $JOB"; exit 1 ;;
          esac
          # live_watch 跑在盯盘专用函数上，其余在 invest-scheduler
          if [ "$JOB" = "live_watch" ]; then FN=investLiveWatch; else FN=investScheduler; fi
          mkdir -p invest-dist noderuntime   # 占位：invoke 只走控制面，不需要真实代码目录
          echo "→ invoke $FN payload=$JOB"
          # s invoke 对函数报错也返回 0，这里显式检查 InvocationError 让本步骤如实变红
          s "$FN" invoke -e "{\"payload\":\"$JOB\"}" --access aliyun | tee /tmp/invoke.out
          ! grep -q "Error Type: InvocationError" /tmp/invoke.out
